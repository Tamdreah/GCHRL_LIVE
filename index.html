<!DOCTYPE html>
<html>
<head>
<title>GCRL Live Results</title>
</head>
<body>

<h1 id="track">Loading...</h1>

<p id="status"></p>

<table border="1">
<tr>
<th>Pos</th>
<th>Driver</th>
<th>Laps</th>
</tr>
<tbody id="results"></tbody>
</table>

<script>

fetch('race.json')
.then(function(response){
    return response.json();
})
.then(function(data){

    document.getElementById('track').innerText = data.track;

    document.getElementById('status').innerText =
        'Heat ' + data.heat +
        ' of ' + data.totalHeats +
        ' - ' + data.status;

    var html = '';

    data.drivers.forEach(function(d){

        html += '<tr>';
        html += '<td>' + d.position + '</td>';
        html += '<td>' + d.name + '</td>';
        html += '<td>' + d.laps + '</td>';
        html += '</tr>';

    });

    document.getElementById('results').innerHTML = html;

});

</script>

</body>
</html>
